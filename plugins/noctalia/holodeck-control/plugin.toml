id = "holodeck/control"
name = "Holodeck Control"
version = "0.4.6"
plugin_api = 9
author = "holodeck"
license = "MIT"
dependencies = ["holodeckctl"]
tags = ["nixos", "system", "utility"]
icon = "cube-spark"
