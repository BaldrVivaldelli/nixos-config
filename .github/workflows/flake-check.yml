name: flake-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Home Manager boundary
        run: ./verify-user-only.sh

      - name: Verify physical desktop removal
        run: ./verify-no-desktop.sh

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check flake
        run: >-
          nix --extra-experimental-features "nix-command flakes"
          flake check --print-build-logs
